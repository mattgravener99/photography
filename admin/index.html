<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload — Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --bg: #0b0b0c; --fg: #e8e8e8; --muted: #8a8a8a; --border: #2a2a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 2rem; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.2rem; }
  label { display: block; margin: 1rem 0 0.25rem; font-size: 0.85rem; color: var(--muted); }
  input[type="text"], input[type="password"] { width: 100%; padding: 0.6rem; background: #161616; border: 1px solid var(--border); color: var(--fg); border-radius: 4px; }
  input[type="file"] { margin-top: 0.5rem; }
  button { margin-top: 1.5rem; padding: 0.7rem 1.4rem; background: var(--fg); color: #111; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { margin-top: 1rem; }
  #log { margin-top: 1.5rem; font-size: 0.85rem; white-space: pre-wrap; color: var(--muted); }
  .item { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.75rem; border: 1px solid var(--border); padding: 0.5rem; border-radius: 4px; }
  .item img { width: 60px; height: 60px; object-fit: cover; border-radius: 3px; }
  .item input { flex: 1; }
</style>
</head>
<body>
<h1>Upload photos</h1>

<label for="token">GitHub personal access token (fine-grained, repo-scoped)</label>
<input type="password" id="token" autocomplete="off">

<label for="repo">Repository (owner/name)</label>
<input type="text" id="repo" placeholder="yourname/photosite">

<label for="branch">Branch</label>
<input type="text" id="branch" value="main">

<div class="row">
  <label for="files">Photos</label>
  <input type="file" id="files" accept="image/*" multiple>
</div>

<div id="items"></div>

<button id="upload" disabled>Upload &amp; Publish</button>

<div id="log"></div>

<script src="app.js"></script>
</body>
</html>
